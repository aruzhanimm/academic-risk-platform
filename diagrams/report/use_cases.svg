mate and explanation when available</text><path d="M 172 274 L 352 468" stroke="#000" fill="none" stroke-width="2"  /><ellipse cx="675" cy="468" rx="322" ry="44" fill="white" stroke="#7958A0" stroke-width="2"/><text x="675" y="462" font-size="27" font-weight="bold" text-anchor="middle">UC-04  Manage personal data</text><text x="675" y="492" font-size="24" font-weight="normal" text-anchor="middle">Request export or deletion</text><text x="540" y="600" font-size="25" font-weight="normal" text-anchor="middle">UC-03 is conditional on an evaluated model. A pending data request is not completion.</text></g></svg>