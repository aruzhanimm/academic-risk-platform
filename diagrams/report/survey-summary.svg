<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440"><title>Questionnaire patterns from nine submissions</title><desc>Verified aggregate questionnaire counts. Tool choices permit multiple selections. Difficulty and preferred entry frequency each total nine answers.</desc><rect width="1200" height="1440" fill="white"/><g font-family="Times New Roman" fill="#000000"><text x="46" y="63" font-size="44" font-weight="bold" text-anchor="start">Questionnaire patterns</text><text x="46" y="105" font-size="29" font-weight="normal" text-anchor="start">Nine submissions · Counts shown directly</text><text x="1154" y="63" font-size="36" font-weight="bold" text-anchor="end">n = 9</text><line x1="46" y1="128" x2="1154" y2="128" stroke="#000000" stroke-width="1.2"/><text x="46" y="182" font-size="33" font-weight="bold" text-anchor="start">A. Current planning tools</text><text x="46" y="220" font-size="25" font-weight="normal" text-anchor="start">Multiple selections allowed; bars count selections, not unique students.</text><line x1="414" y1="251" x2="414" y2="640" stroke="#DCE3E7" stroke-width="1"/><text x="414" y="675" font-size="24" font-weight="normal" text-anchor="middle">0</text><line x1="627" y1="251" x2="627" y2="640" stroke="#DCE3E7" stroke-width="1"/><text x="627" y="675" font-size="24" font-weight="normal" text-anchor="middle">3</text><line x1="840" y1="251" x2="840" y2="640" stroke="#DCE3E7" stroke-width="1"/><text x="840" y="675" font-size="24" font-weight="normal" text-anchor="middle">6</text><line x1="1053" y1="251" x2="1053" y2="640" stroke="#DCE3E7" stroke-width="1"/><text x="1053" y="675" font-size="24" font-weight="normal" text-anchor="middle">9</text><text x="46" y="289" font-size="27" font-weight="normal" text-anchor="start">Moodle / learning system</text><rect x="414" y="260" width="426" height="36" rx="4" fill="#35B5A6"/><text x="854" y="289" font-size="27" font-weight="bold" text-anchor="start">6</text><text x="46" y="343" font-size="27" font-weight="normal" text-anchor="start">Memory</text><rect x="414" y="314" width="284" height="36" rx="4" fill="#35B5A6"/><text x="712" y="343" font-size="27" font-weight="bold" text-anchor="start">4</text><text x="46" y="397" font-size="27" font-weight="normal" text-anchor="start">Task list</text><rect x="414" y="368" width="213" height="36" rx="4" fill="#35B5A6"/><text x="641" y="397" font-size="27" font-weight="bold" text-anchor="start">3</text><text x="46" y="451" font-size="27" font-weight="normal" text-anchor="start">Notes / notebook</text><rect x="414" y="422" width="71" height="36" rx="4" fill="#35B5A6"/><text x="499" y="451" font-size="27" font-weight="bold" text-anchor="start">1</text><text x="46" y="505" font-size="27" font-weight="normal" text-anchor="start">iPhone reminders (other)</text><rect x="414" y="476" width="71" height="36" rx="4" fill="#35B5A6"/><text x="499" y="505" font-size="27" font-weight="bold" text-anchor="start">1</text><text x="46" y="559" font-size="27" font-weight="normal" text-anchor="start">Calendar</text><text x="428" y="559" font-size="27" font-weight="bold" text-anchor="start">0</text><text x="46" y="613" font-size="27" font-weight="normal" text-anchor="start">Do not track</text><text x="428" y="613" font-size="27" font-weight="bold" text-anchor="start">0</text><text x="1087" y="675" font-size="24" font-weight="normal" text-anchor="start">count</text><line x1="46" y1="712" x2="1154" y2="712" stroke="#DCE3E7" stroke-width="1"/><text x="46" y="765" font-size="33" font-weight="bold" text-anchor="start">B. Difficulty seeing upcoming tasks and deadlines</text><text x="46" y="802" font-size="25" font-weight="normal" text-anchor="start">Four answers were “often”; two were “never”.</text><rect x="46" y="829" width="112" height="68" rx="5" fill="#EE907C"/><rect x="169" y="829" width="112" height="68" rx="5" fill="#EE907C"/><rect x="292" y="829" width="112" height="68" rx="5" fill="#EE907C"/><rect x="415" y="829" width="112" height="68" rx="5" fill="#EE907C"/><rect x="538" y="829" width="112" height="68" rx="5" fill="#5C9EDE"/><rect x="661" y="829" width="112" height="68" rx="5" fill="#5C9EDE"/><rect x="784" y="829" width="112" height="68" rx="5" fill="#B6DACA"/><rect x="907" y="829" width="112" height="68" rx="5" fill="#C4D9EF"/><rect x="1030" y="829" width="112" height="68" rx="5" fill="#C4D9EF"/><rect x="46" y="923" width="22" height="22" rx="3" fill="#EE907C"/><text x="78" y="943" font-size="27" font-weight="normal" text-anchor="start">Often: 4</text><rect x="327" y="923" width="22" height="22" rx="3" fill="#5C9EDE"/><text x="359" y="943" font-size="27" font-weight="normal" text-anchor="start">Sometimes: 2</text><rect x="608" y="923" width="22" height="22" rx="3" fill="#B6DACA"/><text x="640" y="943" font-size="27" font-weight="normal" text-anchor="start">Rarely: 1</text><rect x="889" y="923" width="22" height="22" rx="3" fill="#C4D9EF"/><text x="921" y="943" font-size="27" font-weight="normal" text-anchor="start">Never: 2</text><text x="46" y="991" font-size="25" font-weight="normal" text-anchor="start">Zero answers: almost always, no assignments, unsure.</text><line x1="46" y1="1022" x2="1154" y2="1022" stroke="#DCE3E7" stroke-width="1"/><text x="46" y="1075" font-size="33" font-weight="bold" text-anchor="start">C. Preferred entry frequency</text><rect x="46" y="1106" width="354" height="184" rx="8" fill="#FFFFFF" stroke="#DCE3E7"/><rect x="46" y="1106" width="354" height="10" rx="3" fill="#35B5A6"/><text x="223" y="1177" font-size="47" font-weight="bold" text-anchor="middle">3</text><text x="223" y="1241" font-size="30" font-weight="normal" text-anchor="middle">Daily</text><rect x="423" y="1106" width="354" height="184" rx="8" fill="#FFFFFF" stroke="#DCE3E7"/><rect x="423" y="1106" width="354" height="10" rx="3" fill="#5C9EDE"/><text x="600" y="1177" font-size="47" font-weight="bold" text-anchor="middle">3</text><text x="600" y="1227" font-size="29" font-weight="normal" text-anchor="middle">Several times</text><text x="600" y="1260" font-size="29" font-weight="normal" text-anchor="middle">weekly</text><rect x="800" y="1106" width="354" height="184" rx="8" fill="#FFFFFF" stroke="#DCE3E7"/><rect x="800" y="1106" width="354" height="10" rx="3" fill="#EE907C"/><text x="977" y="1177" font-size="47" font-weight="bold" text-anchor="middle">3</text><text x="977" y="1241" font-size="30" font-weight="normal" text-anchor="middle">Weekly</text><text x="46" y="1340" font-size="24" font-weight="normal" text-anchor="start">Convenience sample; nine submissions are not verified as nine unique people.</text><text x="46" y="1375" font-size="24" font-weight="normal" text-anchor="start">Questions were optional. Counts describe the recorded answers only.</text><text x="46" y="1410" font-size="24" font-weight="normal" text-anchor="start">Source: questionnaire summary checked on 24 October 2026.</text></g></svg>