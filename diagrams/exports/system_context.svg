<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">System context</title>
<desc id="diagram-description">A student submits voluntary workload observations and data-control requests to the Academic Risk Platform, which returns personal history and result states. A deployment operator has a separate control-plane role. University LMS, medical records and adviser workspaces have no active connections.</desc>
<defs>
<marker id="arrow-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#17364d"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#087f8c"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#516778"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="63" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#17364d">System context</text>
<text x="60" y="101" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#516778">Academic Risk Platform · Proposed scope; no implementation is asserted</text>
