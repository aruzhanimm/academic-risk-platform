<polyline id="student-response" points="510,490 330,490" fill="none" stroke="#17364d" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-navy)" />
<polyline id="operator-control" points="1170,350 990,350" fill="none" stroke="#516778" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arrow-muted)" />
<polyline id="operator-status" points="990,490 1170,490" fill="none" stroke="#516778" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arrow-muted)" />
<rect x="60" y="275" width="270" height="300" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="2.5"/>
