<rect x="999" y="505.05" width="162" height="59.9" rx="7" fill="white"/>
<text x="1080" y="529.305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#516778">Operational</text>
<text x="1080" y="552.255" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#516778">status</text>
<text x="60" y="962" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#516778">Solid arrows: student requests and responses · Dashed arrows: control-plane interactions · Conceptual design</text>
