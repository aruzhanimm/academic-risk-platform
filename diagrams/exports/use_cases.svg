<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1270" viewBox="0 0 1500 1270" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Student use cases</title>
<desc id="diagram-description">The Student actor participates in four use cases inside the Academic Risk Platform boundary: voluntarily enter an observation after an information notice, view own history, inspect an eligible estimate and explanation or an unavailable state, and request export or deletion. Associations indicate participation, not data flow. Authentication is a required design control, not an implemented capability.</desc>
<defs>
<marker id="arrow-navy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#17364d"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#087f8c"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#516778"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="63" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#17364d">Student use cases</text>
<text x="60" y="101" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#516778">Academic Risk Platform · UML use-case view of proposed behaviour</text>
<rect x="365" y="150" width="1075" height="900" rx="18" fill="#ffffff" stroke="#a6bac5" stroke-width="2"/>
<text x="387" y="184" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#17364d">Academic Risk Platform</text>
<text x="387" y="212" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#516778">Student-facing functional scope</text>
<polyline id="student-uc-01" points="208,515 500,312.5" fill="none" stroke="#516778" stroke-width="2.4" stroke-linejoin="round" />
<polyline id="student-uc-02" points="208,515 500,507.5" fill="none" stroke="#516778" stroke-width="2.4" stroke-linejoin="round" />
<polyline id="student-uc-03" points="208,515 500,702.5" fill="none" stroke="#516778" stroke-width="2.4" stroke-linejoin="round" />
<polyline id="student-uc-04" points="208,515 500,897.5" fill="none" stroke="#516778" stroke-width="2.4" stroke-linejoin="round" />
<circle cx="160" cy="462" r="22" fill="white" stroke="#17364d" stroke-width="3"/>
<path d="M 160 484 V 565 M 112 515 H 208 M 160 565 L 120 625 M 160 565 L 200 625" fill="none" stroke="#17364d" stroke-width="3" stroke-linecap="round"/>
<text x="160" y="662" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#17364d">Student</text>
<text x="160" y="690" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#516778">Own records only</text>
<ellipse cx="925" cy="312.5" rx="425" ry="67.5" fill="#eff8f8" stroke="#087f8c" stroke-width="2.5"/>
<text x="925" y="285.14" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17364d">UC-01  Enter an observation</text>
<text x="925" y="325.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Read the purpose and voluntary-use notice</text>
<text x="925" y="354.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Enter workload information for validation</text>
<ellipse cx="925" cy="507.5" rx="425" ry="67.5" fill="#eff8f8" stroke="#087f8c" stroke-width="2.5"/>
<text x="925" y="480.14" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17364d">UC-02  View own history</text>
<text x="925" y="520.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Review dated personal observations</text>
<text x="925" y="549.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Identify empty history or missing entries</text>
<ellipse cx="925" cy="702.5" rx="425" ry="67.5" fill="#eff8f8" stroke="#087f8c" stroke-width="2.5"/>
<text x="925" y="675.14" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17364d">UC-03  Inspect result and explanation</text>
<text x="925" y="715.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">View an eligible estimate and available explanation</text>
<text x="925" y="744.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Or see insufficient_data / model_unavailable</text>
<ellipse cx="925" cy="897.5" rx="425" ry="67.5" fill="#eff8f8" stroke="#087f8c" stroke-width="2.5"/>
<text x="925" y="870.14" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#17364d">UC-04  Request export or deletion</text>
<text x="925" y="910.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Request a defined scope for personal records</text>
<text x="925" y="939.86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#516778">Track actual status; acceptance is not completion</text>
<rect x="60" y="1095" width="1380" height="115" rx="16" fill="#f7fafc" stroke="#a6bac5" stroke-width="2.5"/>
<text x="750" y="1130.175" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#516778">Solid associations show participation, not data-flow direction.</text>
<text x="750" y="1157.725" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#516778">Authentication and ownership checks are required; their implementation is not asserted.</text>
<text x="750" y="1185.275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#516778">Deployment operations are outside these student use cases.</text>
<text x="60" y="1232" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#516778">Conceptual design · Use-case identifiers match the requirements and architecture documents</text>
</svg>
