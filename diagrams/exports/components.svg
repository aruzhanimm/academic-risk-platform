<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1570" viewBox="0 0 1500 1570" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Proposed components and trust boundaries</title>
<desc id="diagram-description">A React interface communicates with a FastAPI application over HTTPS and JSON. The application request boundary owns authentication, record ownership, validation and orchestration. Storage access and the ML adapter are internal modules of one application, not microservices. PostgreSQL and reviewed model artifacts have separate boundaries. Offline training prepares candidates for review and manual release, with no automatic training or runtime research-data access. A missing eligible model produces an unavailable result without a score.</desc>
